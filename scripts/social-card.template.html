<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>王子棋 · 分享预览图</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#eceee9;background:#101214}
.card{position:relative;width:100%;height:100%;padding:52px 64px;background-image:linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:32px 32px}
.brand{font-size:25px;font-weight:600;letter-spacing:1px}
.brand span{display:inline-block;margin-left:24px;padding-left:24px;border-left:1px solid #404445;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.5px;color:#919795;vertical-align:middle}
.document-id{position:absolute;right:64px;top:60px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#919795;letter-spacing:1.5px}
.header-line{height:1px;background:#343939;position:absolute;left:64px;right:64px;top:109px}
.copy{position:absolute;left:64px;top:148px;width:704px}
.tag{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.6px;color:#b8d995}
.tag::before{content:"";display:inline-block;width:7px;height:7px;margin-right:12px;background:#b8d995}
.heading{font-size:57px;line-height:1.3;letter-spacing:-1.7px;font-weight:600;margin-top:19px}
.heading strong{color:#b8d995;font-weight:600}
.skills{max-width:670px;line-height:1.65;color:#a6adaa;font-size:20px;margin-top:23px}
.proof{position:absolute;left:64px;bottom:108px;width:704px;font-size:14px;line-height:1.6;color:#929b96}
.proof span+span{margin-left:24px}
.right{position:absolute;width:280px;right:64px;top:153px}
.diagram-label{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.5px;color:#8b9490;margin-bottom:22px}
.node{height:63px;margin-bottom:18px;display:flex;align-items:center;border:1px solid #3c4440;background:#151917}
.node-index{display:flex;align-items:center;justify-content:center;align-self:stretch;width:49px;flex:none;border-right:1px solid #3c4440;color:#7b877d;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
.node-label{padding-left:19px;font:16px ui-monospace,SFMono-Regular,Consolas,monospace;color:#c5d4bd}
.diagram-note{font-size:12px;line-height:1.5;color:#7c8780;margin-top:24px}
.line{height:1px;background:#343939;position:absolute;left:64px;right:64px;bottom:68px}
.domain{position:absolute;left:64px;bottom:29px;font:13px ui-monospace,SFMono-Regular,Consolas,monospace;color:#a8b0aa}
.foot{position:absolute;right:64px;bottom:29px;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.3px;color:#7f8983}
html[lang="en"] .heading{font-size:49px;line-height:1.18;letter-spacing:-1.2px}
html[lang="en"] .skills{font-size:21px;line-height:1.5}
.case .heading{font-size:49px;line-height:1.3}
html[lang="en"] .case .heading{font-size:45px;line-height:1.2}
.case .skills{font-size:22px;line-height:1.6;color:#b3bbb6}
html[lang="en"] .case .skills{font-size:21px;line-height:1.5}
</style>
<div class="card">
  <div class="brand">王子棋<span>ENGINEERING NOTES</span></div>
  <div class="document-id">PROFILE / 00</div>
  <div class="header-line"></div>
  <div class="copy">
    <div class="tag">JAVA / FULL-STACK / AI</div>
    <div class="heading">我是王子棋，<br><strong>写代码，也做架构。</strong></div>
    <div class="skills">Java 后端 · 系统架构 · 前端与 AI 应用</div>
  </div>
  <div class="proof"><span>近 15 年软件研发</span><span>5 年技术组长</span></div>
  <div class="right">
    <div class="diagram-label">工程实践 / SELECTED WORK</div>
    <div class="node"><span class="node-index">01</span><span class="node-label">SYSTEMS</span></div>
    <div class="node"><span class="node-index">02</span><span class="node-label">AI</span></div>
    <div class="node"><span class="node-index">03</span><span class="node-label">DELIVERY</span></div>
    <div class="diagram-note">业务项目 · 技术方案 · 研发原型</div>
  </div>
  <div class="line"></div>
  <div class="domain">owenpi-alt.github.io/zh/</div>
  <div class="foot">项目记录 / PORTFOLIO</div>
</div>
</html>
