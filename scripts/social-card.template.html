<!doctype html>
<html lang="{{language}}">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>{{title}}</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1d1d1f;background:#f5f5f7;-webkit-font-smoothing:antialiased}
.card{position:relative;width:100%;height:100%;padding:56px 64px}
.brand{font-size:25px;font-weight:600;letter-spacing:-.4px}
.copy{position:absolute;left:64px;top:157px;width:720px}
.tag{font-size:17px;line-height:1.5;color:#6e6e73;margin-bottom:17px}
.tag:empty{display:none}
.heading{font-size:64px;line-height:1.2;letter-spacing:-2.3px;font-weight:600;text-wrap:balance}
.heading br{display:none}
.heading strong{display:block;color:#0071e3;font-weight:600;text-wrap:balance}
.skills{max-width:695px;line-height:1.6;color:#6e6e73;font-size:23px;margin-top:26px}
.proof{position:absolute;left:64px;bottom:111px;width:720px;font-size:17px;line-height:1.6;color:#6e6e73}
.proof span+span{margin-left:28px}
.right{position:absolute;width:266px;right:64px;top:182px}
.flow{display:grid;gap:28px}
.node{position:relative;min-height:68px;padding:17px 20px;display:flex;align-items:center;justify-content:center;border:1px solid #e6e8ec;border-radius:18px;background:#fff;text-align:center}
.node:nth-child(2){background:#eaf3fc;border-color:#dfebf8}
.node+.node::before{content:"";position:absolute;left:50%;top:-29px;width:1px;height:28px;background:#cbd9e9}
.node-label{font-size:20px;line-height:1.3;font-weight:500;color:#3a526c}
.diagram-note{font-size:13px;line-height:1.6;color:#6e6e73;margin-top:23px;text-align:center}
.line{height:1px;background:#e1e3e6;position:absolute;left:64px;right:64px;bottom:72px}
.domain{position:absolute;left:64px;bottom:32px;font-size:14px;color:#86868b}
.foot{position:absolute;right:64px;bottom:32px;font-size:14px;color:#86868b}
html[lang="en"] .heading{font-size:58px;line-height:1.16;letter-spacing:-1.7px}
html[lang="en"] .skills{font-size:22px;line-height:1.5}
.case .copy{top:139px}
.case .heading{font-size:52px;line-height:1.25;letter-spacing:-1.4px}
.case .skills{font-size:24px;line-height:1.55;margin-top:22px}
html[lang="en"] .case .heading{font-size:49px;line-height:1.16;letter-spacing:-1.5px}
html[lang="en"] .case .skills{font-size:23px;line-height:1.5}
html[lang="en"] .node-label{font-size:18px}
</style>
<div class="card{{cardClass}}">
  <div class="brand">{{brand}}</div>
  <div class="copy">
    <div class="tag">{{tag}}</div>
    <div class="heading">{{heading}}</div>
    <div class="skills">{{skills}}</div>
  </div>
  <div class="proof">{{proof}}</div>
  <div class="right">
    <div class="flow">{{nodes}}</div>
    <div class="diagram-note">{{diagramNote}}</div>
  </div>
  <div class="line"></div>
  <div class="domain">{{domain}}</div>
  <div class="foot">{{foot}}</div>
</div>
</html>
